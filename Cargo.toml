[package]
name = "fluidpaper"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5.4", features = ["derive"] }
pdfium-render = { version = "0.8.37", default-features = false, features = ["pdfium_latest", "thread_safe"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
